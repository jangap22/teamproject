services:
  resolver:
    build:
      context: ./resolver
      args:
        BIND9_PREFERRED_VERSION: "${BIND9_PREFERRED_VERSION}"
        BIND9_FALLBACK_SERIES: "${BIND9_FALLBACK_SERIES}"
    image: scenario-resolver:bind9-9.18
    container_name: resolver
    ports:
      - "${RESOLVER_HOST_DNS_PORT}:${DNS_PORT}/tcp"
      - "${RESOLVER_HOST_DNS_PORT}:${DNS_PORT}/udp"
    expose:
      - "${ALERT_PORT}/udp"
    environment:
      DNS_PORT: "${DNS_PORT}"
      AUTH_IP: "${AUTH_IP}"
      EXTERNAL_AUTH_IP: "${EXTERNAL_AUTH_IP}"
      RESOLVER_ATTACK_UDP_PORT: "${RESOLVER_ATTACK_UDP_PORT}"
      ALERT_BIND_HOST: "${ALERT_BIND_HOST}"
      ALERT_PORT: "${ALERT_PORT}"
    networks:
      scenario-net:
        ipv4_address: "${RESOLVER_IP}"
    restart: unless-stopped

  sniffer:
    build:
      context: ./sniffer
    image: scenario-sniffer:python
    container_name: sniffer
    depends_on:
      - resolver
    environment:
      DNS_PORT: "${DNS_PORT}"
      RESOLVER_IP: "${RESOLVER_IP}"
      AUTH_IP: "${AUTH_IP}"
      EXTERNAL_AUTH_IP: "${EXTERNAL_AUTH_IP}"
      ALERT_PORT: "${ALERT_PORT}"
      SNIFFER_INTERFACE: "${SNIFF_INTERFACE}"
      SNIFFER_RESOLVER_IP: "${RESOLVER_IP}"
      SNIFFER_RESOLVER_PORT: "${DNS_PORT}"
      SNIFFER_BPF_FILTER: "dst host ${RESOLVER_IP} and (udp port ${DNS_PORT} or tcp port ${DNS_PORT})"
      SNIFFER_MODE: "ids"
      SNIFFER_SAMPLING_ENABLED: "true"
      SNIFFER_BASE_SAMPLE_RATE: "1.0"
      SNIFFER_INSPECT_ALL_RESPONSES: "true"
      SNIFFER_RESPONSE_SAMPLE_RATE: "1.0"
      SNIFFER_QUERY_SAMPLE_RATE: "0.1"
      SNIFFER_ALWAYS_INSPECT_SUSPICIOUS: "true"
      SNIFFER_SAMPLING_RANDOM_SEED: "42"
      SNIFFER_RATE_LIMIT_WINDOW_SECONDS: "1.0"
      SNIFFER_MAX_PER_QNAME_PER_WINDOW: "50"
      SNIFFER_MAX_PER_SIGNATURE_PER_WINDOW: "100"
      SNIFFER_STATS_INTERVAL_SECONDS: "10"
      SNIFFER_LOG_SAMPLING_DROPS: "false"
      SNIFFER_SAMPLING_DROP_LOG: "/data/detections/sampling_drops.csv"
      SNIFFER_WINDOW_SECONDS: "2"
      SNIFFER_DUPLICATE_TXID_THRESHOLD: "3"
      SNIFFER_DUPLICATE_DNS_ID_WINDOW_SECONDS: "2.0"
      SNIFFER_DUPLICATE_DNS_ID_THRESHOLD: "2"
      SNIFFER_RESPONSE_BURST_THRESHOLD: "100"
      SNIFFER_RESPONSE_BURST_WINDOW_SECONDS: "1.0"
      SNIFFER_LARGE_SECTION_COUNT_THRESHOLD: "10"
      SNIFFER_EXTREME_TTL_LOW: "0"
      SNIFFER_EXTREME_TTL_HIGH: "86400"
      SNIFFER_RF_PROBA_THRESHOLD: "0.7"
      SNIFFER_AUTH_IPS: "${AUTH_IP},${EXTERNAL_AUTH_IP}"
      SNIFFER_SAVE_FEATURE_CSV: "false"
      SNIFFER_SAVE_DETECTION_CSV: "true"
      SNIFFER_FEATURE_CSV: "/data/captures/features.csv"
      SNIFFER_DETECTION_CSV: "/data/detections/detection_results.csv"
      SNIFFER_MODEL_PATH: "/models/randomforest_model.joblib"
      SNIFFER_ALERT_ENABLED: "true"
      SNIFFER_ALERT_METHOD: "udp"
      SNIFFER_ALERT_HOST: "127.0.0.1"
      SNIFFER_ALERT_PORT: "${ALERT_PORT}"
      SNIFFER_ALERT_FILE: "/data/alerts/ids_alerts.jsonl"
      SNIFFER_ALERT_COOLDOWN_SECONDS: "1"
      SNIFFER_TARGET_DOMAIN: "${TARGET_DOMAIN}"
      SNIFFER_FAKE_IP: "${FAKE_WEB_IP}"
    network_mode: "service:resolver"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../data:/data
      - ../models:/models:ro
    restart: unless-stopped

  auth:
    build:
      context: ./auth
      args:
        BIND9_PREFERRED_VERSION: "${BIND9_PREFERRED_VERSION}"
        BIND9_FALLBACK_SERIES: "${BIND9_FALLBACK_SERIES}"
    image: scenario-auth:bind9-9.18
    container_name: auth
    cap_add:
      - NET_ADMIN
    environment:
      AUTH_DELAY_MS: "${AUTH_DELAY_MS}"
      AUTH_DELAY_IFACE: "${AUTH_DELAY_IFACE}"
      DNS_PORT: "${DNS_PORT}"
      REAL_WEB_IP: "${REAL_WEB_IP}"
      AUTH_IP: "${AUTH_IP}"
    ports:
      - "${AUTH_HOST_DNS_PORT}:${DNS_PORT}/tcp"
      - "${AUTH_HOST_DNS_PORT}:${DNS_PORT}/udp"
    networks:
      scenario-net:
        ipv4_address: "${AUTH_IP}"
    restart: unless-stopped

  external-auth:
    build:
      context: ./external-auth
      args:
        BIND9_PREFERRED_VERSION: "${BIND9_PREFERRED_VERSION}"
        BIND9_FALLBACK_SERIES: "${BIND9_FALLBACK_SERIES}"
    image: scenario-external-auth:bind9-9.18
    container_name: external-auth
    environment:
      DNS_PORT: "${DNS_PORT}"
      EXTERNAL_AUTH_IP: "${EXTERNAL_AUTH_IP}"
      EXTERNAL_DOMAIN_SUFFIX: "${EXTERNAL_DOMAIN_SUFFIX}"
      EXTERNAL_DOMAIN_COUNT: "${EXTERNAL_DOMAIN_COUNT}"
    ports:
      - "${EXTERNAL_AUTH_HOST_DNS_PORT}:${DNS_PORT}/tcp"
      - "${EXTERNAL_AUTH_HOST_DNS_PORT}:${DNS_PORT}/udp"
    networks:
      scenario-net:
        ipv4_address: "${EXTERNAL_AUTH_IP}"
    restart: unless-stopped

  attacker:
    build:
      context: ./attacker
    image: scenario-attacker:scapy
    container_name: attacker
    privileged: true
    command: ["sleep", "infinity"]
    environment:
      RESOLVER_IP: "${RESOLVER_IP}"
      AUTH_IP: "${AUTH_IP}"
      TARGET_DOMAIN: "${TARGET_DOMAIN}"
      FAKE_WEB_IP: "${FAKE_WEB_IP}"
      RESOLVER_ATTACK_UDP_PORT: "${RESOLVER_ATTACK_UDP_PORT}"
      DNS_PORT: "${DNS_PORT}"
      ATTACK_NS_NAME: "${ATTACK_NS_NAME}"
    networks:
      scenario-net:
        ipv4_address: "${ATTACKER_IP}"
    restart: unless-stopped

  client:
    build:
      context: ./client
    image: scenario-client:python
    container_name: client
    depends_on:
      - resolver
      - auth
      - external-auth
    environment:
      RESOLVER_IP: "${RESOLVER_IP}"
      RESOLVER_PORT: "${DNS_PORT}"
      EXTERNAL_DOMAIN_SUFFIX: "${EXTERNAL_DOMAIN_SUFFIX}"
      EXTERNAL_DOMAIN_COUNT: "${EXTERNAL_DOMAIN_COUNT}"
      ZIPF_S: "${ZIPF_S}"
      NXDOMAIN_RATIO: "${NXDOMAIN_RATIO}"
      TOTAL_QUERIES: "${TOTAL_QUERIES}"
      DURATION_SECONDS: "${DURATION_SECONDS}"
      WARMUP_SECONDS: "${WARMUP_SECONDS}"
      ATTACK_WINDOW_SECONDS: "${ATTACK_WINDOW_SECONDS}"
      COOLDOWN_SECONDS: "${COOLDOWN_SECONDS}"
      NORMAL_QPS: "${NORMAL_QPS}"
      TIMEOUT_SECONDS: "${CLIENT_TIMEOUT_SECONDS}"
      PROGRESS_INTERVAL_SECONDS: "${CLIENT_PROGRESS_INTERVAL_SECONDS}"
    networks:
      scenario-net:
        ipv4_address: "${CLIENT_IP}"
    restart: unless-stopped

  real-web:
    build:
      context: ./real-web
    image: scenario-real-web:nginx
    container_name: real-web
    ports:
      - "${REAL_WEB_HOST_PORT}:${REAL_WEB_PORT}"
    networks:
      scenario-net:
        ipv4_address: "${REAL_WEB_IP}"
    restart: unless-stopped

  fake-web:
    build:
      context: ./fake-web
    image: scenario-fake-web:nginx
    container_name: fake-web
    ports:
      - "${FAKE_WEB_HOST_PORT}:${FAKE_WEB_PORT}"
    networks:
      scenario-net:
        ipv4_address: "${FAKE_WEB_IP}"
    restart: unless-stopped

networks:
  scenario-net:
    driver: bridge
    ipam:
      config:
        - subnet: "${NETWORK_SUBNET}"
