<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Test - Real Service</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #e8fff1;
        --panel: #ffffff;
        --text: #123524;
        --accent: #1f9d55;
        --soft: #bdeccf;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, #f8fff9, transparent 32%),
          linear-gradient(135deg, var(--bg), #d4f7e1);
        color: var(--text);
      }

      main {
        width: min(720px, calc(100% - 32px));
        background: var(--panel);
        border: 3px solid var(--soft);
        border-radius: 24px;
        padding: 40px 32px;
        box-shadow: 0 24px 60px rgba(31, 157, 85, 0.18);
      }

      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Green Site</div>
      <h1>Trusted Bank Test Portal</h1>
      <p>
        This is the legitimate service endpoint for the lab scenario.
        If you see this green page, DNS resolution is still pointing to
        the normal web server.
      </p>
    </main>
  </body>
</html>
